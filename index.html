<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>МАРАФОН ГТА SAN ANDREAS — SAYFERGOAT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700&display=swap');

  :root{
    --ink:#F5F5F2;
    --muted:#8D8D96;

  }

  html,body{
    background:var(--bg);

  }
  #wrap{
    width:380px;
    padding:14px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- marathon timer — bare text on a transparent background ---------- */
  #timerLabel{
    font-family:'Bebas Neue', sans-serif;
    font-size:16px;
    font-weight:900;
    font-synthesis: weight;
    -webkit-text-stroke: 1px var(--yellow);
    letter-spacing:2.5px;
    color:var(--yellow);
    text-transform:uppercase;
    text-align:center;
    text-shadow:
      0 0 1px rgba(0,0,0,1),
      0 2px 4px rgba(0,0,0,0.95),
      0 2px 10px rgba(0,0,0,0.9);
    margin-bottom:6px;
  }
  #timerValue{
    font-family:'Bebas Neue', sans-serif;
    font-size:52px;
    color:var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing:2px;
    white-space:nowrap;
    text-align:center;
    text-shadow:0 3px 10px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.95);
  }
  #timerDays{
    font-size:24px;
    color:var(--ink);
    margin-right:8px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    text-shadow:0 3px 10px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

<div id="wrap">

  <span id="timerLabel">МАРАФОН ГТА SAN ANDREAS</span>
  <span><span id="timerValue">00:00:00</span></span>

</div>

<script>
const CHANNEL = "sayfergoat";
const STORAGE_KEY = "twitch_top3_sayfergoat_marathon";

// Таймер марафона считает НАКОПЛЕННОЕ время (accumulatedMs) + время с последнего
// "возобновления" (lastResumeTimestamp), пока стрим в сети (isLive = true).
// Как только стрим уходит в оффлайн, таймер ЗАСТЫВАЕТ (накопленное время фиксируется,
// isLive становится false) и не идёт дальше, пока стример снова не запустит трансляцию —
// тогда таймер продолжает считать с того же места, где остановился.
//
// Управлять таймером в чате могут стример (broadcaster) и модераторы канала:
//   !resetmarathon           — обнулить таймер (начать с 00:00:00)
//   !settime ЧЧ:ММ:СС        — выставить таймер на конкретное значение
//                               (часы можно указывать больше 23, например 42:25:04
//                               — это будет отображено как "1д 18:25:04")
//   !settime Nd ЧЧ:ММ:СС     — то же самое, но дни отдельным числом
//                               (например: !settime 1d 18:25:04)
//   !pausemarathon            — поставить таймер на паузу вручную
//                               (держится, даже пока стрим live, пока не возобновят)
//   !resumemarathon           — возобновить таймер после ручной паузы
//                               (алиас: !unpausemarathon)
//
// ВАЖНО про надёжность: состояние хранится в localStorage конкретного браузера/
// браузерного источника OBS. Пока это тот же самый браузерный движок/профиль
// (тот же браузерный источник в той же OBS на том же ПК), значение переживёт:
// перезапуск стрима, перезапуск OBS, перезагрузку компьютера.
// НЕ переживёт: очистку кэша/данных браузера, смену браузерного источника на новый
// (пустой) без импорта данных, или запуск виджета на другом ПК/OBS без переноса
// данных браузера. Если марафон критичен, стоит держать один и тот же браузерный
// источник и не чистить его кэш.
// Начальное значение таймера: 24 часа 30 минут 35 секунд.
const INITIAL_ELAPSED_MS = ((24 * 3600) + (30 * 60) + 35) * 1000;

// Как часто проверять, идёт ли стрим сейчас, чтобы поставить таймер на паузу/снять с паузы.
const LIVE_CHECK_INTERVAL_MS = 30000;
// Публичный (без токена) эндпоинт для проверки статуса трансляции.
const UPTIME_CHECK_URL = 'https://decapi.me/twitch/uptime/' + CHANNEL.toLowerCase() + '?offline_msg=OFFLINE';

let state = {
  accumulatedMs: INITIAL_ELAPSED_MS, // накопленное время на паузах/на момент последней остановки
  lastResumeTimestamp: Date.now(),   // когда последний раз таймер "стартовал" (в live-режиме)
  isLive: true,                       // сейчас идёт отсчёт или таймер застыл
  manualPause: false                  // таймер поставлен на паузу вручную командой !pausemarathon
};

let ws = null;
let reconnectDelay = 1000;
const MAX_RECONNECT_DELAY = 15000;

const timerValueEl = document.getElementById('timerValue');

function loadMarathon(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(typeof parsed.accumulatedMs === 'number' && parsed.accumulatedMs >= 0){
        state.accumulatedMs = parsed.accumulatedMs;
        state.lastResumeTimestamp = typeof parsed.lastResumeTimestamp === 'number' ? parsed.lastResumeTimestamp : Date.now();
        state.isLive = typeof parsed.isLive === 'boolean' ? parsed.isLive : true;
        state.manualPause = typeof parsed.manualPause === 'boolean' ? parsed.manualPause : false;
      }
    }
  }catch(e){
    console.error("Ошибка загрузки марафона", e);
  }
  saveMarathon(); // фиксируем на диске сразу же, даже если это самый первый запуск
}

function saveMarathon(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("Ошибка сохранения марафона", e);
  }
}

function currentElapsedMs(){
  if(state.isLive){
    return state.accumulatedMs + (Date.now() - state.lastResumeTimestamp);
  }
  return state.accumulatedMs;
}

function resetMarathon(){
  state.accumulatedMs = 0;
  state.lastResumeTimestamp = Date.now();
  state.isLive = true;
  saveMarathon();
}

// Выставляет накопленное время таймера на конкретное значение (в миллисекундах).
// Если стрим сейчас live — таймер продолжает идти дальше от этого значения.
// Если стрим офлайн — таймер просто "застывает" на этом значении.
function setMarathonMs(ms){
  const clamped = Math.max(0, Math.floor(ms));
  state.accumulatedMs = clamped;
  state.lastResumeTimestamp = Date.now();
  // isLive не трогаем — остаётся как было (пауза/лайв)
  saveMarathon();
}

// Разбирает аргумент команды !settime в миллисекунды.
// Поддерживаемые форматы:
//   "ЧЧ:ММ:СС"        -> часы могут быть больше 23 (напр. "42:25:04")
//   "ММ:СС"           -> просто минуты:секунды
//   "Nd ЧЧ:ММ:СС" / "Nд ЧЧ:ММ:СС" -> дни отдельным числом первым аргументом
// Возвращает миллисекунды или null, если формат не распознан.
function parseTimeArg(argsText){
  const parts = argsText.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return null;

  let days = 0;
  let timePart = parts[0];

  if(parts.length >= 2){
    const dayMatch = parts[0].match(/^(\d+)\s*[dд]$/i);
    if(dayMatch){
      days = parseInt(dayMatch[1], 10);
      timePart = parts[1];
    }
  }

  const segments = timePart.split(':').map(s => s.trim());
  if(segments.length < 2 || segments.length > 3) return null;
  if(!segments.every(s => /^\d+$/.test(s))) return null;

  let h = 0, m = 0, s = 0;
  if(segments.length === 3){
    [h, m, s] = segments.map(Number);
  }else{
    [m, s] = segments.map(Number);
  }

  if(m > 59 || s > 59) return null;

  const totalMs = (((days * 24 + h) * 3600) + (m * 60) + s) * 1000;
  return totalMs;
}

function pauseMarathon(){
  if(state.isLive){
    state.accumulatedMs = currentElapsedMs();
    state.isLive = false;
    saveMarathon();
  }
}

function resumeMarathon(){
  if(!state.isLive){
    state.lastResumeTimestamp = Date.now();
    state.isLive = true;
    saveMarathon();
  }
}

// Ручная пауза командой !pausemarathon. Ставит таймер на паузу и запоминает,
// что пауза ручная — чтобы автопроверка статуса стрима (checkLiveStatus) не сняла
// её сама, пока стример/модератор явно не возобновят таймер командой.
function manualPauseMarathon(){
  state.manualPause = true;
  pauseMarathon();
}

// Ручное возобновление командой !resumemarathon / !unpausemarathon.
// Снимает флаг ручной паузы и запускает отсчёт немедленно.
// Если по факту стрим сейчас офлайн, ближайшая автопроверка (раз в 30 сек)
// снова поставит таймер на паузу — это ожидаемое поведение.
function manualResumeMarathon(){
  state.manualPause = false;
  resumeMarathon();
}

// Проверка, идёт ли стрим сейчас. ОТКЛЮЧЕНО: таймер всегда работает сам по себе
// и не зависит от реального статуса трансляции. Останавливается/запускается
// только вручную командами !pausemarathon / !resumemarathon.
async function checkLiveStatus(){
  return;
}

function connect(){
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  ws.onopen = () => {
    const nick = 'justinfan' + Math.floor(10000 + Math.random()*89999);
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK ' + nick);
    ws.send('JOIN #' + CHANNEL.toLowerCase());
  };

  ws.onmessage = (event) => {
    const lines = event.data.split('\r\n').filter(Boolean);
    for(const line of lines){
      handleLine(line);
    }
  };

  ws.onclose = () => {
    scheduleReconnect();
  };

  ws.onerror = () => {
    try{ ws.close(); }catch(e){}
  };
}

function scheduleReconnect(){
  setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.6, MAX_RECONNECT_DELAY);
}

// Подключение к чату оставлено ради команд управления таймером
// (!resetmarathon, !settime) от стримера и модераторов.
// Сам таймер от этого соединения никак не зависит и продолжает идти даже без него.
function handleLine(line){
  if(line.startsWith('PING')){
    ws.send('PONG :tmi.twitch.tv');
    return;
  }

  if(line.includes(' 366 ') || line.includes('JOIN #')){
    reconnectDelay = 1000;
  }

  if(line.includes('PRIVMSG')){
    const msg = parsePrivmsg(line);
    if(!msg) return;
    if(!isAllowedToControl(msg)) return;

    const text = msg.text.trim();

    if(text === '!resetmarathon'){
      resetMarathon();
      return;
    }

    if(text === '!pausemarathon'){
      manualPauseMarathon();
      return;
    }

    if(text === '!resumemarathon' || text === '!unpausemarathon'){
      manualResumeMarathon();
      return;
    }

    const setMatch = text.match(/^!settime\s+(.+)$/i);
    if(setMatch){
      const ms = parseTimeArg(setMatch[1]);
      if(ms !== null){
        setMarathonMs(ms);
      }
      return;
    }
  }
}

// Разбирает строку тегов IRC вида "@badge-info=;badges=broadcaster/1,moderator/1;mod=1;..."
// в объект { badges: "...", mod: "1", ... }
function parseTags(rawTags){
  const tags = {};
  if(!rawTags) return tags;
  rawTags.split(';').forEach(pair => {
    const idx = pair.indexOf('=');
    if(idx === -1) return;
    tags[pair.slice(0, idx)] = pair.slice(idx + 1);
  });
  return tags;
}

// Может ли автор сообщения управлять таймером: сам стример или модератор канала.
function isAllowedToControl(msg){
  if(msg.login === CHANNEL.toLowerCase()) return true; // сам стример (по логину, на всякий случай)
  if(msg.tags.mod === '1') return true;                // модератор (тег mod)
  if(msg.tags.badges && /(^|,)(broadcaster|moderator)\//.test(msg.tags.badges)) return true; // на случай, если tags.mod не пришёл
  return false;
}

function parsePrivmsg(line){
  // Строка может начинаться с блока тегов "@...", отделённого пробелом от остальной части.
  let rawTags = '';
  let rest = line;
  if(line.startsWith('@')){
    const spaceIdx = line.indexOf(' ');
    rawTags = line.slice(1, spaceIdx);
    rest = line.slice(spaceIdx + 1);
  }

  const match = rest.match(/:([^!]+)!\S*\sPRIVMSG\s#\S+\s:(.*)/);
  if(!match) return null;

  return {
    login: match[1].toLowerCase(),
    text: match[2],
    tags: parseTags(rawTags)
  };
}

function pad(n){ return String(n).padStart(2, '0'); }

function renderTimer(){
  const elapsedSec = Math.max(0, Math.floor(currentElapsedMs() / 1000));
  const hours = Math.floor(elapsedSec / 3600);
  const minutes = Math.floor((elapsedSec % 3600) / 60);
  const seconds = elapsedSec % 60;

  timerValueEl.textContent = pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
}

loadMarathon();
renderTimer();
setInterval(renderTimer, 1000);
connect();
checkLiveStatus();
setInterval(checkLiveStatus, LIVE_CHECK_INTERVAL_MS);
</script>
