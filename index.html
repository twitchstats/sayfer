<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>МАРАФОН ГТА SAN ANDREAS — SAYFERGOAT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700&display=swap');

  :root{
    --ink:#F5F5F2;
    --muted:#8D8D96;
    --yellow:#F2C230;
    --hot:#FF3E6C;
    --panel:#141416;
    --panel2:#1C1C20;
    --line:rgba(255,255,255,0.09);
    --bg:transparent;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  #wrap{
    width:380px;
    padding:14px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- marathon timer — bare text on a transparent background ---------- */
  #timerLabel{
    font-family:'Bebas Neue', sans-serif;
    font-size:16px;
    font-weight:900;
    font-synthesis: weight;
    -webkit-text-stroke: 1.5px var(--yellow);
    letter-spacing:2.5px;
    color:var(--yellow);
    text-transform:uppercase;
    text-align:center;
    text-shadow:
      0 0 1px rgba(0,0,0,1),
      0 2px 4px rgba(0,0,0,0.95),
      0 2px 10px rgba(0,0,0,0.9);
    margin-bottom:6px;
  }
  #timerValue{
    font-family:'Bebas Neue', sans-serif;
    font-size:52px;
    color:var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing:2px;
    white-space:nowrap;
    text-align:center;
    text-shadow:0 3px 10px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.95);
  }
  #timerDays{
    font-size:24px;
    color:var(--ink);
    margin-right:8px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    text-shadow:0 3px 10px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

<div id="wrap">

  <span id="timerLabel">МАРАФОН ГТА SAN ANDREAS</span>
  <span><span id="timerDays"></span><span id="timerValue">00:00:00</span></span>

</div>

<script>
const CHANNEL = "sayfergoat";
const STORAGE_KEY = "twitch_top3_sayfergoat_marathon_v2";

// Таймер марафона считается накопленным временем (accumulatedMs) + текущий "живой"
// отрезок (segmentStart), пока стрим онлайн. Он НИКОГДА не сбрасывается сам:
// не по дисконнекту чата, не по перезапуску OBS/страницы/компьютера.
// Сбросить его может только сам стример командой !resetmarathon в чате.
//
// ПАУЗА НА ОФЛАЙНЕ: раз в 30 секунд виджет спрашивает у decapi.me, идёт ли
// стрим сейчас. Как только стрим уходит в офлайн — таймер замирает (накопленное
// время фиксируется). Когда стрим включается заново — таймер продолжает
// с той же самой точки, а не с нуля (время офлайна не засчитывается в марафон).
//
// ВАЖНО про надёжность: состояние хранится в localStorage конкретного браузера/
// браузерного источника OBS. Пока это тот же самый браузерный профиль, значение
// переживёт перезапуск стрима, перезапуск OBS, перезагрузку компьютера.
// НЕ переживёт: очистку кэша/данных браузера или запуск на другом ПК/OBS без
// переноса данных браузера.

// Начальное значение таймера: 10 часов 13 минут 47 секунд уже "прошло" на момент
// первого запуска виджета.
const INITIAL_ELAPSED_MS = ((10 * 3600) + (13 * 60) + 47) * 1000;

let accumulatedMs = INITIAL_ELAPSED_MS; // зафиксированное время (когда стрим офлайн — это и есть итог)
let segmentStart = Date.now();          // момент начала текущего "живого" отрезка
let isLive = true;                      // предполагаем, что стрим идёт, пока не проверили статус

let ws = null;
let reconnectDelay = 1000;
const MAX_RECONNECT_DELAY = 15000;

const timerValueEl = document.getElementById('timerValue');
const timerDaysEl = document.getElementById('timerDays');

function loadMarathon(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(typeof parsed.accumulatedMs === 'number' && parsed.accumulatedMs >= 0){
        accumulatedMs = parsed.accumulatedMs;
      }
      if(typeof parsed.segmentStart === 'number' && parsed.segmentStart > 0){
        segmentStart = parsed.segmentStart;
      }
      if(typeof parsed.isLive === 'boolean'){
        isLive = parsed.isLive;
      }
    }
  }catch(e){
    console.error("Ошибка загрузки марафона", e);
  }
  saveMarathon(); // фиксируем на диске сразу же, даже если это самый первый запуск
}

function saveMarathon(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ accumulatedMs, segmentStart, isLive }));
  }catch(e){
    console.error("Ошибка сохранения марафона", e);
  }
}

function resetMarathon(){
  accumulatedMs = 0;
  segmentStart = Date.now();
  isLive = true;
  saveMarathon();
}

function getElapsedMs(){
  return isLive ? (accumulatedMs + (Date.now() - segmentStart)) : accumulatedMs;
}

// Проверка, идёт ли стрим сейчас, через публичный сервис decapi.me (без токенов и ключей).
const STATUS_CHECK_INTERVAL_MS = 30000;

async function checkLiveStatus(){
  try{
    const res = await fetch('https://decapi.me/twitch/uptime/' + CHANNEL, { cache: 'no-store' });
    if(!res.ok) return; // сервис недоступен — оставляем состояние как есть
    const text = (await res.text()).trim().toLowerCase();
    const offline = text.includes('offline');
    applyLiveStatus(!offline);
  }catch(e){
    // сеть/CORS недоступны — не трогаем текущее состояние таймера
    console.error("Ошибка проверки статуса стрима", e);
  }
}

function applyLiveStatus(nowLive){
  if(nowLive === isLive) return; // статус не изменился

  if(nowLive){
    // стрим включился — продолжаем с той же точки
    segmentStart = Date.now();
    isLive = true;
  }else{
    // стрим ушёл в офлайн — замораживаем накопленное время
    accumulatedMs += Date.now() - segmentStart;
    isLive = false;
  }
  saveMarathon();
}

function connect(){
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  ws.onopen = () => {
    const nick = 'justinfan' + Math.floor(10000 + Math.random()*89999);
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK ' + nick);
    ws.send('JOIN #' + CHANNEL.toLowerCase());
  };

  ws.onmessage = (event) => {
    const lines = event.data.split('\r\n').filter(Boolean);
    for(const line of lines){
      handleLine(line);
    }
  };

  ws.onclose = () => {
    scheduleReconnect();
  };

  ws.onerror = () => {
    try{ ws.close(); }catch(e){}
  };
}

function scheduleReconnect(){
  setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.6, MAX_RECONNECT_DELAY);
}

// Подключение к чату оставлено только ради одной команды — !resetmarathon от стримера.
// Сам таймер от этого соединения никак не зависит и продолжает идти даже без него.
function handleLine(line){
  if(line.startsWith('PING')){
    ws.send('PONG :tmi.twitch.tv');
    return;
  }

  if(line.includes(' 366 ') || line.includes('JOIN #')){
    reconnectDelay = 1000;
  }

  if(line.includes('PRIVMSG')){
    const msg = parsePrivmsg(line);
    if(msg && msg.text.trim() === '!resetmarathon' && msg.login === CHANNEL.toLowerCase()){
      resetMarathon();
    }
  }
}

function parsePrivmsg(line){
  const match = line.match(/:([^!]+)!\S*\sPRIVMSG\s#\S+\s:(.*)/);
  if(!match) return null;
  return { login: match[1].toLowerCase(), text: match[2] };
}

function pad(n){ return String(n).padStart(2, '0'); }

function renderTimer(){
  const elapsedSec = Math.max(0, Math.floor(getElapsedMs() / 1000));
  const days = Math.floor(elapsedSec / 86400);
  const hours = Math.floor((elapsedSec % 86400) / 3600);
  const minutes = Math.floor((elapsedSec % 3600) / 60);
  const seconds = elapsedSec % 60;

  timerDaysEl.textContent = days > 0 ? (days + 'д ') : '';
  timerValueEl.textContent = pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
}

loadMarathon();
renderTimer();
setInterval(renderTimer, 1000);
connect();
checkLiveStatus();
setInterval(checkLiveStatus, STATUS_CHECK_INTERVAL_MS);
</script>
</body>
</html>
