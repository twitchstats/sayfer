<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TOP 3 CHATTERS — GTA MARATHON — SAYFERGOAT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700&display=swap');

  :root{
    --ink:#F5F5F2;
    --muted:#8D8D96;
    --yellow:#F2C230;
    --hot:#FF3E6C;
    --panel:#141416;
    --panel2:#1C1C20;
    --line:rgba(255,255,255,0.09);
    --gold:#F2C230;
    --silver:#C7C9D1;
    --bronze:#D97A3D;
    --bg:transparent;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  #wrap{
    width:452px;
    padding:16px 18px 18px 18px;
    position:relative;
  }

  /* ---------- header ---------- */
  #headerRow{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px 11px 14px;
  }
  #chan{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:5px;
  }
  #titleBar{
    width:5px;
    height:20px;
    background:var(--yellow);
    border-radius:2px;
    flex:0 0 5px;
  }
  #title{
    font-family:'Bebas Neue', sans-serif;
    font-size:24px;
    letter-spacing:2px;
    color:var(--ink);
    text-transform:uppercase;
  }
  #subtitle{
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
    letter-spacing:0.2px;
  }
  #dot{
    width:7px; height:7px; border-radius:50%;
    background:#ff4444;
    transition:background .3s ease;
  }
  #dot.live{
    background:var(--yellow);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  #stripe{
    height:5px;
    margin:0 0 14px 0;
    background:repeating-linear-gradient(135deg, var(--yellow) 0 10px, #000 10px 20px);
    border-radius:0 0 4px 4px;
  }

  /* ---------- leaderboard ---------- */
  .row{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-left:4px solid var(--line);
    border-radius:6px;
    padding:10px 14px 12px 12px;
    margin-bottom:9px;
    overflow:hidden;
  }
  .row:has(.rank.r1){ border-left-color:var(--gold); }
  .row:has(.rank.r2){ border-left-color:var(--silver); }
  .row:has(.rank.r3){ border-left-color:var(--bronze); }

  .row .bar{
    position:absolute;
    left:0; bottom:0;
    height:4px;
    width:0%;
    background:linear-gradient(90deg, var(--yellow), var(--hot));
    transition: width .6s cubic-bezier(.22,1,.36,1);
    z-index:0;
  }

  .rank{
    font-family:'Bebas Neue', sans-serif;
    font-size:18px;
    letter-spacing:0.5px;
    width:28px; height:28px;
    flex:0 0 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    background:rgba(255,255,255,0.06);
    color:var(--ink);
    z-index:1;
  }
  .rank.r1{ background:var(--gold); color:#1a1408; }
  .rank.r2{ background:var(--silver); color:#1a1a1a; }
  .rank.r3{ background:var(--bronze); color:#1a1108; }

  .avatar-wrap{
    position:relative;
    width:32px; height:32px;
    flex:0 0 32px;
    border-radius:50%;
    z-index:1;
    background:rgba(0,0,0,0.4);
    border:2px solid var(--line);
  }
  .avatar-wrap.r1{ border-color:var(--gold); }
  .avatar-wrap.r2{ border-color:var(--silver); }
  .avatar-wrap.r3{ border-color:var(--bronze); }
  .avatar-img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }
  .avatar-fallback{
    width:100%; height:100%;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-family:'Bebas Neue', sans-serif;
    font-size:14px;
    color:#fff;
  }

  .info{
    flex:1;
    z-index:1;
    min-width:0;
  }
  .name{
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .count{
    font-family:'Bebas Neue', sans-serif;
    font-size:19px;
    letter-spacing:0.5px;
    color:var(--yellow);
    z-index:1;
    font-variant-numeric: tabular-nums;
    min-width:34px;
    text-align:right;
  }
  .empty{
    color:var(--muted);
    font-size:13px;
    font-style:italic;
    padding:14px 4px;
    text-align:center;
  }

  #footer{
    display:flex;
    justify-content:space-between;
    font-family:'Bebas Neue', sans-serif;
    font-size:13px;
    letter-spacing:0.8px;
    color:var(--muted);
    margin-top:4px;
    padding:0 2px;
  }
</style>
</head>
<body>

<div id="wrap">

  <div id="headerRow">
    <div id="chan">
      <span id="titleBar"></span>
      <span id="title">GTA МАРАФОН</span>
    </div>
    <div id="subtitle"><span id="dot"></span> <span id="status">подключение...</span> <span style="opacity:.55">· sayfergoat</span></div>
  </div>
  <div id="stripe"></div>

  <div id="list">
    <div class="empty">Ждём сообщения в чате...</div>
  </div>

  <div id="footer">
    <span id="totalMsgs">СООБЩЕНИЙ: 0</span>
    <span id="totalUsers">ЧАТТЕРОВ: 0</span>
  </div>
</div>

<script>
const CHANNEL = "sayfergoat";
const STORAGE_KEY = "twitch_top3_sayfergoat_marathon";

// Боты, которых никогда не считаем в топе (логины в нижнем регистре).
const IGNORED_USERS = ['fossabot', 'fassabot'];

// Вечная стата — сбрасывается ТОЛЬКО вручную командой !resettop от стримера.
let stats = {};
let totalMessages = 0;

let ws = null;
let reconnectDelay = 1000;
const MAX_RECONNECT_DELAY = 15000;

const dotEl = document.getElementById('dot');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const totalMsgsEl = document.getElementById('totalMsgs');
const totalUsersEl = document.getElementById('totalUsers');

function loadStats() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      stats = parsed.stats || {};
      totalMessages = parsed.totalMessages || 0;
    }
    purgeIgnoredUsers();
  } catch(e) {
    console.error("Ошибка загрузки сохранений", e);
  }
}

function saveStats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      stats,
      totalMessages
    }));
  } catch(e) {
    console.error("Ошибка сохранения", e);
  }
}

function purgeIgnoredUsers(){
  let changed = false;
  IGNORED_USERS.forEach(login => {
    if(stats[login]){
      totalMessages = Math.max(0, totalMessages - (stats[login].count || 0));
      delete stats[login];
      changed = true;
    }
  });
  if(changed) saveStats();
}

function resetStats() {
  stats = {};
  totalMessages = 0;
  saveStats();
  render();
}

function setStatus(text, live){
  statusEl.textContent = text;
  dotEl.classList.toggle('live', !!live);
}

function connect(){
  setStatus('подключение...', false);
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  ws.onopen = () => {
    const nick = 'justinfan' + Math.floor(10000 + Math.random()*89999);
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK ' + nick);
    ws.send('JOIN #' + CHANNEL.toLowerCase());
  };

  ws.onmessage = (event) => {
    const lines = event.data.split('\r\n').filter(Boolean);
    for(const line of lines){
      handleLine(line);
    }
  };

  ws.onclose = () => {
    setStatus('отключено, переподключение...', false);
    scheduleReconnect();
  };

  ws.onerror = () => {
    setStatus('ошибка соединения...', false);
    try{ ws.close(); }catch(e){}
  };
}

function scheduleReconnect(){
  setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.6, MAX_RECONNECT_DELAY);
}

function handleLine(line){
  if(line.startsWith('PING')){
    ws.send('PONG :tmi.twitch.tv');
    return;
  }

  if(line.includes(' 366 ') || line.includes('JOIN #')){
    setStatus('в эфире — ' + CHANNEL.toUpperCase(), true);
    reconnectDelay = 1000;
  }

  if(line.includes('PRIVMSG')){
    const msg = parsePrivmsg(line);
    if(msg) registerMessage(msg);
  }
}

function parsePrivmsg(line){
  let tags = {};
  let rest = line;

  if(line.startsWith('@')){
    const spaceIdx = line.indexOf(' ');
    const tagStr = line.slice(1, spaceIdx);
    rest = line.slice(spaceIdx + 1);
    tagStr.split(';').forEach(pair => {
      const eq = pair.indexOf('=');
      if(eq > -1){
        tags[pair.slice(0, eq)] = pair.slice(eq + 1);
      }
    });
  }

  const match = rest.match(/^:([^!]+)!/);
  if(!match) return null;
  const login = match[1].toLowerCase();

  const msgMatch = rest.match(/PRIVMSG #[^ ]+ :(.*)/);
  const text = msgMatch ? msgMatch[1] : '';

  const displayName = tags['display-name'] && tags['display-name'].length
    ? tags['display-name']
    : login;
  const color = tags['color'] && tags['color'].length ? tags['color'] : null;

  return { login, displayName, color, text };
}

// Антиспам: не считаем слишком частые сообщения одного юзера и повторяющийся копипаст.
const MIN_INTERVAL_MS = 1200;      // минимальный интервал между засчитанными сообщениями
const DUPLICATE_WINDOW_MS = 10000; // окно, в котором повтор того же текста считается спамом

function registerMessage(msg){
  if(msg.text.trim() === '!resettop' && msg.login === CHANNEL.toLowerCase()) {
    resetStats();
    return;
  }

  if(IGNORED_USERS.includes(msg.login)){
    return;
  }

  const now = Date.now();
  const prev = stats[msg.login];
  const normalizedText = msg.text.trim().toLowerCase();

  if(prev){
    const sinceLast = now - (prev.lastTime || 0);
    const tooFast = sinceLast < MIN_INTERVAL_MS;
    const isDuplicate = normalizedText.length > 0
      && normalizedText === prev.lastText
      && sinceLast < DUPLICATE_WINDOW_MS;

    if(tooFast || isDuplicate){
      prev.lastTime = now;
      prev.lastText = normalizedText;
      return;
    }
  }

  if(!stats[msg.login]){
    stats[msg.login] = { name: msg.displayName, color: msg.color, count: 0, lastTime: 0, lastText: '' };
  }
  stats[msg.login].name = msg.displayName;
  if(msg.color) stats[msg.login].color = msg.color;
  stats[msg.login].count += 1;
  stats[msg.login].lastTime = now;
  stats[msg.login].lastText = normalizedText;
  totalMessages += 1;

  saveStats();
  render();
}

function fallbackColor(seed){
  const palette = ['#F2C230','#FF3E6C','#00e5ff','#ff7ce0','#8B5CFF','#6bd8ff','#7CFF7C'];
  let hash = 0;
  for(let i=0;i<seed.length;i++) hash = seed.charCodeAt(i) + ((hash<<5)-hash);
  return palette[Math.abs(hash) % palette.length];
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function render(){
  const entries = Object.entries(stats)
    .map(([login, v]) => ({ login, ...v }))
    .sort((a,b) => b.count - a.count)
    .slice(0, 3);

  totalMsgsEl.textContent = 'СООБЩЕНИЙ: ' + totalMessages;
  totalUsersEl.textContent = 'ЧАТТЕРОВ: ' + Object.keys(stats).length;

  if(entries.length === 0){
    listEl.innerHTML = '<div class="empty">Ждём сообщения в чате...</div>';
    return;
  }

  const maxCount = entries[0].count || 1;
  const medals = ['r1','r2','r3'];
  const rankNum = ['1','2','3'];

  listEl.innerHTML = entries.map((e, i) => {
    const pct = Math.max(8, Math.round((e.count / maxCount) * 100));
    const color = e.color || fallbackColor(e.login);
    const initial = escapeHtml((e.name || e.login).trim().charAt(0).toUpperCase());
    return `
      <div class="row">
        <div class="bar" style="width:${pct}%"></div>
        <div class="rank ${medals[i]}">${rankNum[i]}</div>
        <div class="avatar-wrap ${medals[i]}">
          <img class="avatar-img" alt="" style="display:none;">
          <div class="avatar-fallback" style="display:flex; background:${color}">${initial}</div>
        </div>
        <div class="info">
          <div class="name" style="color:${color}">${escapeHtml(e.name)}</div>
        </div>
        <div class="count">${e.count}</div>
      </div>
    `;
  }).join('');

  Array.from(listEl.children).forEach((rowEl, idx) => {
    loadAvatar(entries[idx].login, rowEl);
  });
}

// ---- аватарки твича ----
// Основной способ: официальный GraphQL Twitch (тот же, которым пользуется сам twitch.tv),
// публичный логин-less Client-Id "kimne78kx3ncx6brgo4mv6wki5h1ko" — без токена, без CORS-проблем.
// decapi.me оставлен как резервный вариант на случай, если GQL недоступен.
const avatarCache = {};
const AVATAR_CACHE_MS = 25 * 60 * 1000;
const TWITCH_GQL_CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';

async function getAvatarUrl(login){
  const cached = avatarCache[login];
  if(cached && (Date.now() - cached.time) < AVATAR_CACHE_MS){
    return cached.url;
  }

  try{
    const resp = await fetch('https://gql.twitch.tv/gql', {
      method: 'POST',
      headers: {
        'Client-Id': TWITCH_GQL_CLIENT_ID,
        'Content-Type': 'text/plain;charset=UTF-8'
      },
      body: JSON.stringify({
        query: `{ user(login: "${login}") { profileImageURL(width: 300) } }`
      })
    });
    if(resp.ok){
      const json = await resp.json();
      const url = json && json.data && json.data.user && json.data.user.profileImageURL;
      if(url){
        avatarCache[login] = { url, time: Date.now() };
        return url;
      }
    }
  }catch(e){
    console.error('GQL-аватар не получен для', login, e);
  }

  try{
    const resp2 = await fetch('https://decapi.me/twitch/avatar/' + encodeURIComponent(login));
    if(resp2.ok){
      const text = (await resp2.text()).trim();
      if(text.startsWith('http')){
        avatarCache[login] = { url: text, time: Date.now() };
        return text;
      }
    }
  }catch(e){
    console.error('decapi.me-аватар не получен для', login, e);
  }

  return cached ? cached.url : null;
}

function loadAvatar(login, rowEl){
  getAvatarUrl(login).then(url => {
    if(!url) return;
    const img = rowEl.querySelector('.avatar-img');
    const fallback = rowEl.querySelector('.avatar-fallback');
    if(!img) return;
    img.onload = () => { img.style.display = 'block'; if(fallback) fallback.style.display = 'none'; };
    img.onerror = () => { img.style.display = 'none'; if(fallback) fallback.style.display = 'flex'; };
    img.src = url;
  });
}

loadStats();
render();
connect();
</script>
</body>
</html>
